    <style>
        table{
            border-collapse: collapse;
            width: 100%;
                thead{
                    th{
                        background-color: #e44d26;
                        border: #fff9;
                        color: #000;
                        padding: 0.4rem;
                    }

                }
                tbody{
                    tr{
                        &:nth-child(even) {
                            background-color: #fff3;
                        }
                        td{
                            border: 2px solid #fff9;
                            color: #fff9;
                            font-size: 0.8rem;
                            padding: 0.4rem;
                        }
                    }
                }
                tfoot{
                    td{
                        background-color: #e44d26;
                        border: #fff9;
                        color: #000;
                        padding: 0.4rem;

                }
                
            }
        }
    </style>
