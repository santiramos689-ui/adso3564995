<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-challenge</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section{
        div.gallery{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 120px);
    gap: 10px;
    grid-template-areas:
        "one two three" "four two five" "six six seven";
    }

        div.gallery img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 2px solid #fff; 
            border-radius: 12px;
        }

    

        .one{
            grid-area: one;
        }

        .two{
            grid-area: two;
        }

        .three{
            grid-area: three;
        }

        .four{
            grid-area: four;
        }

        .five{
            grid-area: five;
        }

        .six{
            grid-area: six;
        }

        .seven{
            grid-area: seven;
        }
    }
        section.gallery2 {
    div.gallery {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 120px);
        gap: 10px;

        grid-template-areas:
            "uno uno dos tres"
            "uno uno cuatro cuatro"
            "cinco seis cuatro cuatro";
    }

    div.gallery img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border: 2px solid #fff;
        border-radius: 12px;
        box-sizing: border-box;
    }

    .uno {
        grid-area: uno;
    }

    .dos {
        grid-area: dos;
    }

    .tres {
        grid-area: tres;
    }

    .cuatro {
        grid-area: cuatro;
    }

    .cinco {
        grid-area: cinco;
    }

    .seis {
        grid-area: seis;
    }
}
    
        
    </style>
    
</head>
<body class="css">

            </svg>
        </a>

        <header class="mmenu">

        </header>
        <section>
            <h3 class="subtitle">Gallery01:</h3>
            <div class="gallery">
                <img src="imgs/grid/ani01.png" alt="Imagen 1" class="one">
                <img src="imgs/grid/ani02.png" alt="Imagen 2" class="two">
                <img src="imgs/grid/ani03.png" alt="Imagen 3" class="three">
                <img src="imgs/grid/ani04.png" alt="Imagen 4" class="four">
                <img src="imgs/grid/ani05.png" alt="Imagen 5" class="five">
                <img src="imgs/grid/ani06.png" alt="Imagen 6" class="six">

            </div>
        </section>
        <section class="gallery2">
            <h3 class="subtitle">Gallery02:</h3>
            <div class="gallery">
                <img src="imgs/grid/ani01.png" alt="Imagen 1" class="uno">
                <img src="imgs/grid/ani02.png" alt="Imagen 2" class="dos">
                <img src="imgs/grid/ani03.png" alt="Imagen 3" class="tres">
                <img src="imgs/grid/ani04.png" alt="Imagen 4" class="cuatro">
                <img src="imgs/grid/ani05.png" alt="Imagen 5" class="cinco">

            </div>
        </section>
        
    </main>
