<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-clip-path</title>
    <link rel="stylesheet" href="../src/css/master.css">
</head>
<style>
    section {
        div.clip {
            background: url(imgs/pittsburgh.jpg)
                        no-repeat center /cover;
            margin: 2rem auto;
            height: 280px;
            width: 280px;
            transition: all 0.5s ease;
            &.clip1 {
                clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
                &:hover {
                    clip-path: polygon(50% 0%, 76% 0, 100% 0, 100% 59%, 100% 100%, 62% 100%, 27% 100%, 0 100%, 0 0, 14% 0);;
                }               
            }
            &.clip2 {
                clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%);
                &:hover{
                    clip-path: polygon(0 0, 0% 20%, 0 49%, 0 100%, 20% 100%, 50% 100%, 80% 100%, 100% 100%, 100% 60%, 100% 20%, 100% 0, 44% 0);
                }
            }
        }
    }
</style>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="white" viewBox="0 0 256 256">
                <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu">
            <h1>32-clip-path</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>Property lets you clip an element to a basic shape.</h3>
        </header>
        <section>
            <h3 class="subtitle">Example 01:</h3>
            <div class="clip clip1"></div>
            <h3 class="subtitle">Example 02:</h3>
            <div class="clip clip2"></div>
        </section>
    </main>
</body>
</html>
