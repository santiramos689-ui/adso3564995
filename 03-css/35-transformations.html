<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>35-Transformations</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            img {
                display: block;
                margin: 2rem auto;

                &.transform1 {
                    transform: rotate(90deg);
                }
                &.transform2 {
                    transform: scale(.5);
                }
                &.transform3 {
                    transform: translateX(-100px);
                }
                &.transform4 {
                    transform: skew(30deg);
                }
                &.transform5 {
                    transform: rotate(45deg) scale(2);
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M208,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h80a16,16,0,0,0,16-16V88A16,16,0,0,0,208,72Zm0,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h88Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>35-Transformations</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>Property lets you rotate, scale, skew, or translate an element.</h3>
        </header>
        <section>
            <h3 class="subtitle">Rotate: 90deg</h3>
            <img class="transform1" src="imgs/mario.png" width="180px">
            <h3 class="subtitle">Scale: 0.5</h3>
            <img class="transform2" src="imgs/mario.png" width="180px">
            <h3 class="subtitle">TranslateX: -100px</h3>
            <img class="transform3" src="imgs/mario.png" width="180px">
            <h3 class="subtitle">Skew: 30deg</h3>
            <img class="transform4" src="imgs/mario.png" width="180px">
            <h3 class="subtitle">Rotate Scale:</h3>
            <img class="transform5" src="imgs/mario.png" width="180px">
        </section>
    </main>
</body>
</html>
